name: Deploy docs

on:
  # main 推送时自动重建
  push:
    branches: [main, master]
  # 也允许手动触发
  workflow_dispatch:

# 部署到 GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署 job(避免 CI 抢占)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # VitePress lastUpdated 需要完整 git 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # 装顶层依赖
      - name: Install root deps
        run: npm ci

      # build 顶层包(产出 dist/,example 链过去用)
      - name: Build vitepress-allyouneed
        run: npm run build

      # 装 example 站依赖(file: 链回顶层会自动用刚 build 的 dist)
      - name: Install example deps
        working-directory: examples/obsidian-vault
        run: npm install --no-audit --no-fund

      # build example 站(走 GitHub Pages base 路径)
      - name: Build example site
        working-directory: examples/obsidian-vault
        run: npx vitepress build .
        env:
          DEPLOY_BASE: /vitepress-allyouneed/   # 改成你 repo 名(已对应)

      # 上传到 Pages artifact
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/obsidian-vault/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
